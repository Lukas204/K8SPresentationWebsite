apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-handout-app
spec:
  # Replicas managed by HPA
  selector:
    matchLabels:
      app: k8s-handout
  template:
    metadata:
      labels:
        app: k8s-handout
    spec:
      containers:
      - name: app
        image: node:20-slim
        command: ["sh", "-c"]
        args:
        - |
          cd /src/code
          npm install
          npm run build
          npm start
        env:
        - name: DB_HOST
          value: "mariadb"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: handout-db-secret
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: handout-db-secret
              key: db-user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: handout-db-secret
              key: db-password
        - name: PORT
          value: "3000"
        ports:
        - containerPort: 3000
        # HEALTH CHECKS
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        # RESOURCES (Needed for HPA)
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: code-volume
          mountPath: /src
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.2.1
        args:
        - --repo=$(GIT_REPO_URL)
        - --branch=main
        - --wait=60
        - --root=/src
        - --link=code
        env:
        - name: GIT_REPO_URL
          valueFrom:
            secretKeyRef:
              name: handout-git-secret
              key: repo-url
        volumeMounts:
        - name: code-volume
          mountPath: /src
      volumes:
      - name: code-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-handout-service
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: k8s-handout
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: k8s-handout-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k8s-handout-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
